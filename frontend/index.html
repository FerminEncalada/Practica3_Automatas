<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Autómatas AFD y AFND</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<header class="hero">
<h1>Simulador de Autómatas Finitos</h1>
<p>
Comparación interactiva de AFD y AFND con ejecución,
alfabetos, transiciones y diagramas.
</p>
</header>


<div class="panel-grid">

<!-- PANEL IZQUIERDO -->
<div class="card">

<h2>Configuración</h2>

<label>Selecciona ejercicio</label>

<select id="tipo" onchange="actualizarInfo()">
<option value="afd/transacciones">
AFD — Flujo Transacciones Bancarias
</option>

<option value="afd/handshake">
AFD — Three Way Handshake
</option>

<option value="afd/cerradura">
AFD — Cerradura Inteligente
</option>

<option value="afnd/genetica">
AFND — Secuencia Genética
</option>

<option value="afnd/usuario">
AFND — Comportamiento Usuario
</option>

<option value="afnd/telemetria">
AFND — Telemetría IoT
</option>

</select>


<div class="info-box">
<h3>Descripción</h3>
<p id="descripcion"></p>
</div>


<div class="info-box alphabet-box">
<h3>Alfabeto válido</h3>
<div id="alfabeto"></div>
</div>


<label>Ingresar cadena</label>

<input
id="cadena"
type="text"
placeholder=""
autocomplete="off"
/>

<button onclick="evaluar()">
Ejecutar Simulación
</button>


<div class="resultado-card">
<h3>Resultado</h3>
<p id="resultado">
Esperando ejecución...
</p>
</div>

</div>


<!-- PANEL DERECHO -->
<div class="card">

<h2>Modelo del Autómata</h2>

<div class="subcard">
<h3>Tabla de Transiciones</h3>
<pre id="transiciones"></pre>
</div>

<div class="subcard">
<h3>Diagrama de Estados</h3>

<img id="diagrama">
</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
